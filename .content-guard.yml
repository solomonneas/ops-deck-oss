# Project-specific identifying tokens (personal hostnames, home LAN ranges,
# school refs, personal handles) are intentionally NOT declared in this
# tracked file: a published pattern list leaks the very tokens it blocks.
# They live in .githooks/project-blocks.local.txt (untracked, read by the
# hooks and scripts/pr-create.sh) and the PROJECT_BLOCKS_EXTRA Actions
# secret (read by CI). Only generic patterns belong here.
extra_patterns:
  - name: openclaw_user_path
    regex: '/home/user(?!/repos/ops-deck-oss)'
    severity: warn
    note: "Specific home dir path. ~/.openclaw paths are common in docs (warn, not block)."

  - name: workspace_paths
    regex: '~/\.openclaw/workspace/(pipeline|agents|state)'
    severity: warn
    note: "Internal OpenClaw paths. Mention in docs is OK (warn)."
